services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasklane
      POSTGRES_USER: tasklane
      POSTGRES_PASSWORD: tasklane-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklane -d tasklane"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - tasklane-postgres:/var/lib/postgresql/data

  tasklane:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tasklane:tasklane-local-only@postgres:5432/tasklane
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  tasklane-postgres:
